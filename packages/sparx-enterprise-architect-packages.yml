    query: 'sparx enterprise architect'
    result: no first-party package
  - registry: pypi
    queried: [sparx-ea, enterprise-architect, ea-mcp, sparxsystems]
    result: 404 on every candidate
  - registry: nuget
    query: 'sparx enterprise architect'
    result: >-
      Five results, all third-party community packages built ON the Automation Interface —
      MDD4All.EnterpriseArchitect.Manipulations 3.1.0.2, EA.Gen.Addin 1.1.7, EA.Gen.Model 1.2.5,
      MDD4All.SpecIF.DataProvider.EA 3.0.1.18, MDD4All.SpecIF.DataIntegrator.EA 3.0.0.8. None are
      published by Sparx Systems.
  - registry: github
    query: 'org:sparxsystems'
    result: >-
      One public repository (sparxsystems/krino, C#, an unrelated AI research project, last pushed
      2022-11-25, 0 stars). No first-party SDK, no OpenAPI, no .proto. The widely used Enterprise
      Architect tooling on GitHub (GeertBellekens/Enterprise-Architect-Toolpack and
      Enterprise-Architect-Add-in-Framework, Helmut-Ortmann/EnterpriseArchitect_hoTools) is
      community-maintained, not first-party.
sdk_pointer_withheld: >-
  No `SDKs` pointer is emitted. The only first-party client library is a COM type library bundled
  inside a licensed Windows install; there is no independently distributed, versionable client
  library in any language for the OSLC HTTP API. Emitting an SDK pointer would credit a
  downloadable SDK the provider does not ship.
