description: >-
  Sparx Systems ships no first-party client library to any public package registry. Its
  programmatic surface is delivered as Windows binaries: the COM Automation Interface type
  library that installs with Enterprise Architect itself, and the MSI-distributed MCP server
  add-in. The finding matters for an integrator — there is nothing to `npm install` or
  `pip install`, and no versioned dependency an agent can pin.
packages:
  - language: dotnet-com
    registry: bundled
    name: Interop.EA (Enterprise Architect Automation Interface type library)
    url: https://sparxsystems.com/enterprise_architect_user_guide/17.0/automation_and_scripting/automation_interface.htm
    install: Installed with Enterprise Architect; reference the EA type library / Interop.EA.dll from the EA program directory.
    official: true
    version: null
    published: null
    note: >-
      Versioned with the Enterprise Architect product (17.x), not independently. There is no
      registry metadata endpoint to query, and no standalone download — the assembly is only
      present once Enterprise Architect is installed, so a consumer cannot resolve it by version.
  - language: dotnet
    registry: direct-download
    name: MCP_EA_x64.msi (MCP Server for Enterprise Architect, 64-bit)
    url: https://www.sparxsystems.jp/en/MCP/bin/MCP_EA_x64.msi
    install: Download and run the MSI on a Windows host that already has Enterprise Architect installed.
    official: true
    version: 2.8.11
    published: '2026-08-13'
    note: >-
      Version and date read from the provider's own release notes page
      (https://www.sparxsystems.jp/en/MCP/releases.htm). The download URL is unpinned and floats
      to the latest build, so a consumer downloading it cannot tell from the URL which version
      they are getting.
  - language: dotnet
    registry: direct-download
    name: MCP_EA_x86.msi (MCP Server for Enterprise Architect, 32-bit)
    url: https://www.sparxsystems.jp/en/MCP/bin/MCP_EA_x86.msi
    install: Download and run the MSI. Required for 32-bit Enterprise Architect and for EA 15.2 or earlier.
    official: true
    version: 2.8.11
    published: '2026-08-13'
    note: Unpinned download URL; same floating-to-latest caveat as the x64 installer.
registries_checked:
