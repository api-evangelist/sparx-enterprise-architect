coverage:
  tools_total: 38
  read_tools: 19
  write_tools: 17
  delete_tools: 2
  schemas_captured: false
  schemas_note: >-
    inputSchema for each tool is not published and cannot be introspected remotely — the server is
    STDIO-only and requires a licensed Windows Enterprise Architect install. Capturing schemas
    needs an authenticated local introspection run, not a network probe.
data_handling:
  note: >-
    The provider states the MCP server does not itself transmit model information externally, and
    that Sparx Systems Japan does not access model or personal data; the MCP client's LLM may send
    model content to external servers. MCP_EA.log contains no model or personal data, but MCP
    client logs (e.g. Claude's mcp-server-Enterprise Architect.log) record full request/response
    payloads and may contain confidential model content.
