generated: '2026-08-29'
method: searched
source: https://www.sparxsystems.jp/en/MCP/
status: published
name: MCP Server for Enterprise Architect
description: >-
  Official Model Context Protocol server for Sparx Systems Enterprise Architect. Published by
  Sparx Systems Japan Co., Ltd. and announced on the official Sparx Systems community forum
  (topic 49025, 29 May 2025). Ships as a Windows MSI that installs two components into the
  Enterprise Architect program directory: MCP3.exe (the STDIO MCP server executable) and
  MCP_EA.dll (a standard Enterprise Architect add-in that runs inside the EA process and talks
  to the live repository over the COM Automation Interface).
publisher:
  name: Sparx Systems Japan Co., Ltd.
  site: https://www.sparxsystems.jp/en/
  note: >-
    Regional Sparx Systems entity. The release was announced by Sparx Systems Japan on the
    official sparxsystems.com support forum, and the installers are also mirrored under
    www.sparxsystems.com/en/MCP/bin/. Recorded here as first-party.
deployment:
  mode: local-stdio
  install: 'Windows MSI: MCP_EA_x64.msi (64-bit EA) or MCP_EA_x86.msi (32-bit EA and EA <= 15.2)'
  package: https://www.sparxsystems.jp/en/MCP/bin/MCP_EA_x64.msi
  auth: none
  verified: searched
  note: >-
    STDIO only, and deliberately so. The provider states: "There is no plan to offer an
    HTTP-based MCP server for Enterprise Architect, as doing so could violate the Enterprise
    Architect EULA." There is no remote endpoint for an agent to POST to; a human must install
    Enterprise Architect and this add-in on a Windows machine first.
version: 2.8.11
released: '2026-08-13'
release_notes: https://www.sparxsystems.jp/en/MCP/releases.htm
license:
  cost: free
  commercial_use: permitted
  eula: https://www.sparxsystems.jp/en/MCP/eula.htm
requirements:
  os: Windows 10 / Windows 11 only (Linux and macOS not supported)
  runtime: Microsoft .NET Desktop Runtime 9.0.x
  host_application: >-
    Enterprise Architect, any edition, any version EXCEPT 17.2 (documented incompatibility with
    17.2 as of version 2.8.11)
  client: MCP client supporting the STDIO transport
tested_clients:
  - Claude for Windows
  - Visual Studio Code (GitHub Copilot Chat)
  - Antigravity CLI
reported_working_untested:
  - Codex
  - OpenCode
client_config:
  claude_desktop_config.json: |
    {
      "globalShortcut": "",
      "mcpServers": {
        "Enterprise Architect": {
          "command": "C:\\Program Files\\Sparx Systems\\EA\\MCP_Server\\MCP3.exe",
          "args": [""]
        }
      }
    }
launch_arguments:
  - flag: -enableEdit
    description: Enables the creation and modification tools. Disabled by default.
  - flag: -enableDelete
    description: >-
      Enables the deletion tools. Disabled by default. The provider warns that during their own
      testing an instruction to delete tagged values on a package resulted in the entire package
      being deleted, and recommends backing up the project first.
  - flag: -setTimeout N
    description: >-
      Communication timeout with Enterprise Architect, 3-600 seconds. Default 3 seconds. Raise it
      for slower paths such as a Pro Cloud Server repository.
  - flag: -modifiedInfoPath <fullPathToCSVFile>
    description: >-
      Appends a CSV audit trail of every item the AI added, edited or deleted, so AI-authored
      model changes can later be distinguished from human ones.
prompts:
  supported: true
  note: >-
    The server exposes MCP prompts carrying element-type creation rules, because the `type` string
    passed to the creation tools must match the Automation Interface type name exactly.
  published:
    - Creation Rules for UML
    - Creation Rules for SysML 1.5
    - Creation Rules for BPMN 2.0
