generated: '2026-08-29'
method: searched
source: >-
  https://www.sparxsystems.jp/help/17.0/info_accessed_via_oslcam.html,
  https://www.sparxsystems.jp/help/17.0/oslc_serv_provid.html,
  https://www.sparxsystems.jp/en/MCP/
description: >-
  Entity graph of the Enterprise Architect repository as exposed through the Pro Cloud Server OSLC
  API and the MCP server. Read from the provider's resource documentation, not derived from an
  OpenAPI — no OpenAPI exists. Every entity and relationship below is named in the provider's own
  resource tables.
identifiers:
  primary: >-
    Resources are addressed by GUID. The OSLC resource URL form is
    <protocol>://<server>/<model_name>/oslc/re/<resource_GUID>/, which appears as the rdf:about
    attribute on each queried resource.
  secondary: >-
    Packages additionally carry a numeric packageID, which is the identifier the Creation Factory
    requires in ss:packageID.
entities:
  - name: Package
    oslc_resource: true
    mcp_tools: [get_current_package, get_packages_information, get_root_packages, find_packages_by_name, create_or_update_package, clone_package, create_baseline, apply_baseline]
    description: Container node in the model tree. Root packages are the entry point for traversal.
    attributes: [properties, packageID, GUID, created, modified]
  - name: Element
    oslc_resource: true
    mcp_tools: [get_current_elements, get_elements_information, find_elements_by_name, find_element_in_diagrams, create_or_update_elements, clone_elements, select_element_in_browser, select_element_in_diagram, export_element_linked_documents, import_element_linked_documents]
    description: >-
      The modelling atom — a UML/SysML/BPMN/ArchiMate element. Carries everything a Package carries
      plus runtime state, attributes, operations and operation parameters.
  - name: Diagram
    oslc_resource: true
    mcp_tools: [get_current_diagram, get_diagrams_information, get_opened_diagrams, open_diagrams, get_diagram_image, reload_diagrams, create_or_update_diagram, place_elements_on_diagram, remove_elements_from_diagram]
    description: A visual view over elements and connectors.
    attributes: [properties, image, discussions]
    note: 'The diagram image is returned as a Base64-encoded PNG.'
  - name: Connector
    oslc_resource: true
    mcp_tools: [get_current_connector, get_connectors_information, create_or_update_connectors, create_or_update_messages, layout_connectors, change_connector_visibility]
    description: A relationship between elements. Creatable and updatable over OSLC.
  - name: Attribute
    description: Element attribute; carries its own tagged values.
    mcp_tools: [create_or_update_attributes]
  - name: Operation
    description: Element operation; carries its own tagged values and parameters.
    mcp_tools: [create_or_update_operations]
  - name: Parameter
    description: Operation parameter (argument).
  - name: TaggedValue
    description: Arbitrary key/value metadata. Attachable to packages, elements, attributes and operations.
    mcp_tools: [delete_taggedvalue_from_model]
  - name: Requirement
    description: >-
      The OSLC Creation Factory's documented first-class creatable resource, expressed as
      oslc_rm:requirement with dcterms:title, dcterms:description, dcterms:creator, ss:type,
      ss:difficulty, ss:priority and ss:packageID.
  - name: Constraint
  - name: Scenario
  - name: File
  - name: Discussion
    description: Threaded discussion with replies. Attachable to packages, elements and diagrams.
  - name: TestItem
  - name: ResourceAllocation
    description: Assigned-resource record on a package or element.
  - name: MaintenanceItem
    description: 'Umbrella for Change, Defect (bug), Issue, Task (to-do), Document and Feature records.'
  - name: ProjectManagementItem
    description: 'Umbrella for Effort, Risk, Event, Decision and Metric records.'
relationships:
  - from: Package
    to: Package
    kind: has_many
    via: model tree containment
  - from: Package
    to: Element
    kind: has_many
    via: packageID
  - from: Package
    to: Diagram
    kind: has_many
    via: model tree containment
  - from: Element
    to: Attribute
    kind: has_many
  - from: Element
    to: Operation
    kind: has_many
  - from: Operation
    to: Parameter
    kind: has_many
  - from: Element
    to: TaggedValue
    kind: has_many
  - from: Attribute
    to: TaggedValue
    kind: has_many
  - from: Operation
    to: TaggedValue
    kind: has_many
  - from: Diagram
    to: Element
    kind: has_many
    via: diagram placement (place_elements_on_diagram / remove_elements_from_diagram)
  - from: Diagram
    to: Connector
    kind: has_many
  - from: Connector
    to: Element
    kind: belongs_to
    via: source and target element
  - from: Element
    to: Diagram
    kind: has_many
    via: find_element_in_diagrams — every diagram the element appears on
  - from: Package
    to: Discussion
    kind: has_many
  - from: Element
    to: Discussion
    kind: has_many
  - from: Diagram
    to: Discussion
    kind: has_many
  - from: Package
    to: MaintenanceItem
    kind: has_many
  - from: Element
    to: MaintenanceItem
    kind: has_many
  - from: Package
    to: ProjectManagementItem
    kind: has_many
  - from: Element
    to: ProjectManagementItem
    kind: has_many
write_scope:
  creatable_updatable_over_oslc:
    - Package (discussions, tagged values, test items, resource allocations, maintenance items, project management items)
    - Element (attributes, operations, operation parameters, discussions, tagged values, test items, resource allocations, maintenance items, project management items)
    - Connector
  deletable_over_oslc:
    - Anything creatable or updatable
    - Attribute tagged values
    - Operation tagged values
  audit_caveat: >-
    The provider states that changes made through OSLC are NOT recorded even when Enterprise
    Architect auditing is enabled. Combined with the absence of any documented reversal path on the
    OSLC surface, this is the governance fact an integrator most needs to know.
