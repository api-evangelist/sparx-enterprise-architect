support:
  subscription: >-
    A licence includes a 12-month subscription covering major and minor updates, MSI deployment
    packages, access to older versions, priority bug handling, DBMS scripts and patches, and the
    model-security key.
  lapsed_licence: >-
    A lapsed subscription can be reinstated within 2 years at the renewal rate. Without renewal the
    customer loses access to the downloadable installer, and the provider advises keeping a local
    copy of the installation file.
