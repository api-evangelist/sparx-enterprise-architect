source_note: >-
  Prices read from the Sparx Systems North America licence-and-pricing page on 2026-08-29. The
  vendor's own global shop (https://sparxsystems.com/products/ea/shop/) serves a Cloudflare managed
  challenge (HTTP 403) to non-browser clients and could not be read directly, so the regional
  Sparx Systems site is the source of record for this pass. Prices are US dollars and may differ by
  region.
tags:
  - Enterprise Architecture
  - Modeling
  - Software Engineering
  - Systems Engineering
  - UML
description: >-
  Enterprise Architect is sold as a per-user licence with a 12-month subscription for updates and
  support, not as a metered API. There is no API request quota, no overage rate and no
  usage-priced tier anywhere in the product line: the programmatic surfaces (COM Automation
  Interface, Add-In Framework, scripting, and the MCP server) are included with the desktop licence,
  and the OSLC RESTful API is gated on a separately purchased Pro Cloud Server licence rather than
  on call volume. This replaces a 2026-05-04 scaffold that invented free/professional/enterprise
  tiers with fabricated request quotas and rate limits; none of those existed.
plan_count: 5
billing:
  model: perpetual licence + 12-month subscription
  currency: USD
  subscription_includes:
    - Direct support from Sparx Systems support
    - Access to the latest major and minor Enterprise Architect versions
    - MSI packages for deployment
    - Access to older Enterprise Architect versions
    - Priority issue and bug handling
    - DBMS scripts and patches (MS SQL, MySQL, Oracle, PostgreSQL, MSDE, Adaptive Server Anywhere)
    - Security key enabling user/model security features
  renewal: >-
    Renewal is required each year to keep receiving updates. A lapsed licence can be reinstated
    within 2 years at the renewal rate; without renewal the customer loses access to the
    downloadable installer.
  upgrade: >-
    An edition upgrade (e.g. Corporate to Unified) costs the price difference plus a processing fee
    and does not extend the licence validity period.
