x-coverage:
  state: covered
  reason: covered
  detail: >-
    Enterprise Architect is a licensed desktop modelling product, so its programmatic surface is
    real but never vendor-hosted: a first-party STDIO MCP server (v2.8.11, 38 tools) and a
    documented OSLC Architecture Management 2.0 RESTful API that runs on the customer's own Pro
    Cloud Server. Contract discovery was run in full and found no OpenAPI/GraphQL/AsyncAPI on any
    vendor origin, correctly, because the only machine-readable discovery document is the OSLC
    Service Provider Resource served by each customer's own deployment. Note for future runs:
    sparxsystems.com and sparxsystems.com.au serve a Cloudflare managed challenge (HTTP 403) to
    every non-browser client, so all documentation was read from the Sparx Systems Japan help
    mirror (www.sparxsystems.jp/help/17.0/) and the Sparx Systems North America site
    (www.sparxsystems.us), both Sparx Systems entities. Every sparxsystems.com pointer in this file
    returned the same ~5.7KB challenge body, which is a bot policy and not a dead page — none were
    removed.
  evidence:
    - url: https://www.sparxsystems.jp/en/MCP/
      status: 200
    - url: https://www.sparxsystems.jp/help/17.0/oslc_user_cred.html
      status: 200
    - url: https://www.sparxsystems.us/llms.txt
      status: 200
    - url: https://www.sparxsystems.us/openapi.json
      status: 404
    - url: https://sparxsystems.com/.well-known/agent-card.json
      status: 404
    - url: https://sparxsystems.com/enterprise_architect_user_guide/17.0/pcs_overview.htm
      status: 403
