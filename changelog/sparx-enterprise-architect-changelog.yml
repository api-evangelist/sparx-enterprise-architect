    cadence_observed: >-
      Seven releases between 8 July and 13 August 2026 — roughly weekly, all patch-level.
    entries:
      - version: 2.8.11
        date: '2026-08-13'
        breaking: false
        highlights:
          - Added the EULA to the installation process.
          - Allowed the layout_connectors tool for Activity diagrams (experimental).
          - Attribute and operation ordering now updated on insert/move.
          - Fixed sequence-message creation failing in some cases.
          - Fixed meaningless diagram creation/modification dates being returned.
      - version: 2.8.10
        date: '2026-08-07'
        breaking: false
        highlights:
          - Sequence messages reordered after add/delete to ensure correct ordering.
          - Fixed Fork/Join and Merge creation.
          - Fixed connector colour reset when only width was specified.
          - Handled empty Package creation date on MySQL repositories.
      - version: 2.8.9
        date: '2026-07-31'
        breaking: false
        highlights:
          - Added SysML Value property information to the prompts.
          - Returns an explicit error for tools not supported on Enterprise Architect 17.2.
          - Fixed connector routeStyle not being applied.
      - version: 2.8.8
        date: '2026-07-23'
        breaking: false
        highlights:
          - Support for appending new attributes and operations at the end.
          - Removed the order field for new sequence messages to avoid a misleading value.
          - Fixed operation parameters not visible before a diagram reload.
      - version: 2.8.7
        date: '2026-07-21'
        breaking: false
        highlights:
          - Reduced the size of the JSON returned by the server to cut LLM token cost and latency.
          - Accepts the 'SysML1.5::' stereotype prefix and converts it to 'SysML1.4::'.
          - Fixed element type returning the UML base name for profiled elements.
      - version: 2.8.6
        date: '2026-07-17'
        breaking: false
        highlights:
          - Primitive types (Boolean, Integer, ...) supported for Ports, Parts and similar.
          - Element multiplicity supported.
          - Custom properties updatable, aligned with tagged values.
          - position and size may be omitted in place_elements_on_diagram to retain current values.
      - version: 2.8.5
        date: '2026-07-13'
        breaking: false
        highlights:
          - Recommended element sizes added to the UML and SysML prompts.
          - CallBehaviorAction / CallOperationAction creatable without related elements.
          - Sequence-message payload now carries connectorID, needed to delete a message.
      - version: 2.8.4
        date: '2026-07-08'
        breaking: false
        highlights:
          - Support for Sequence diagrams extended by an MDG profile.
